name: Mylo debug APK

# This workflow belongs at the repository root. The Android project is in mylo/.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "screens = the approved screens (bottom Mylo → Voice Mode → Close → reopen; Home and a real Google results page at the approved targets' sizes) and publish the tested APK; full = every device check; search-flow = only Settings provider → Home search box → real results, relaunch, direct URL; shield = Mylo Shield (real-tunnel milestone needs the MYLO_SHIELD_TEST_URL/TOKEN secrets); compat = website-compatibility matrix (local test site + real sites from every provider, with recordings); private = Private Mode (screen, private browsing, tracker blocking, Burn, Lock tabs, entrance recording); voice = Voice Mode (screen, typed chat through the reference Mylo AI gateway with a test upstream, switchboard, privacy receipt); build = compile, unit tests and Layoutlib renders only (no emulator)"
        type: choice
        options: [screens, full, search-flow, shield, compat, private, voice, build]
        default: full
  push:
    branches: ["mylo-development"]
    paths:
      - "mylo/**"
      - ".github/workflows/mylo-debug.yml"
  pull_request:
    paths:
      - "mylo/**"
      - ".github/workflows/mylo-debug.yml"

permissions:
  contents: read

concurrency:
  group: mylo-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable APK and run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mylo
    outputs:
      apk-url: ${{ steps.apk.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false
      - name: Ensure Android 35 build tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK and run URL resolver, AI and voice tests
        env:
          # Optional: a Mylo AI service for this debug build, from repository secrets (never the repository). The
          # development token only exists in debug builds; without these the app says Mylo AI isn't connected.
          MYLO_AI_API_BASE_URL: ${{ secrets.MYLO_AI_API_BASE_URL }}
          MYLO_AI_DEV_TOKEN: ${{ secrets.MYLO_AI_DEV_TOKEN }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest --tests com.mylo.browser.BrowserStateTest --tests 'com.mylo.browser.web.*' --tests 'com.mylo.browser.ai.*' --tests 'com.mylo.browser.voice.*'
      - name: Verify and package debug APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Mylo-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/Mylo-debug.apk
          cd dist
          sha256sum Mylo-debug.apk > Mylo-debug.apk.sha256
      - name: Upload installable Mylo APK
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: Mylo-debug
          path: |
            mylo/dist/Mylo-debug.apk
            mylo/dist/Mylo-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK download link
        env:
          APK_ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          {
            echo '## Install Mylo on Android'
            echo
            echo "[Download Mylo-debug]($APK_ARTIFACT_URL)"
            echo
            echo 'Tap the artifact link, download its ZIP, extract it, then tap Mylo-debug.apk on your Android phone.'
            echo 'The APK is debug signed. Android may ask you to allow installation from the app you use to open it.'
            echo
            echo 'URL resolver tests passed. APK signature verification passed.'
            echo "Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build live search instrumentation APK
        id: test_apk_build
        run: gradle --no-daemon --stacktrace :app:assembleDebugAndroidTest
      - name: Render the production Home against the approved reference
        id: home_layoutlib
        continue-on-error: true
        run: gradle --no-daemon --stacktrace :app:recordPaparazziDebug --tests 'com.mylo.browser.Home*' --tests com.mylo.browser.BrowserChromePreviewTest --tests com.mylo.browser.PrivateModePreviewTest --tests com.mylo.browser.VoiceModePreviewTest
      - name: Upload Android Home reference renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mylo-Home-reference-renders
          path: |
            mylo/app/src/test/snapshots/images/
            mylo/app/src/main/res/drawable-nodpi/approved_home.jpg
            mylo/app/build/reports/paparazzi/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload instrumentation APK
        if: steps.test_apk_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Mylo-debug-tests
          path: mylo/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mylo-unit-test-reports
          path: |
            mylo/app/build/reports/tests/testDebugUnitTest/
            mylo/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

  android-preview:
    name: Verify the APK on a Pixel emulator
    needs: build
    if: inputs.scope != 'build'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (inputs.scope == 'search-flow' || inputs.scope == 'shield') && 15 || inputs.scope == 'screens' && 35 || inputs.scope == 'compat' && 60 || inputs.scope == 'voice' && 40 || inputs.scope == 'private' && 30 || 25 }}
    # APK download remains available in the build job even if live verification fails.
    # A provider denial must remain a visible failure, never a claimed verification.
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Download the exact APK published above
        uses: actions/download-artifact@v4
        with:
          name: Mylo-debug
          path: mylo/dist
      - name: Download live search test APK
        uses: actions/download-artifact@v4
        with:
          name: Mylo-debug-tests
          path: mylo/dist/tests
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify portrait Home, keyboard, providers, and tab navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          # The default RAM leaves Android 35 with live web pages starved: the low-memory killer
          # cleared the system and the emulator stopped responding mid-flow (run 37241786694).
          ram-size: 4096M
          # The compatibility run needs a camera and a microphone for the permission cases.
          emulator-options: ${{ inputs.scope == 'compat' && '-no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back emulated -camera-front emulated' || '-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none' }}
          disable-animations: true
          script: bash mylo/scripts/ci-emulator-smoke.sh mylo/dist/Mylo-debug.apk mylo/dist/preview mylo/dist/tests/app-debug-androidTest.apk
        env:
          MYLO_SCOPE: ${{ inputs.scope || 'full' }}
          # A real test gateway for the Shield milestone; never compiled into the APK.
          MYLO_SHIELD_TEST_URL: ${{ secrets.MYLO_SHIELD_TEST_URL }}
          MYLO_SHIELD_TEST_TOKEN: ${{ secrets.MYLO_SHIELD_TEST_TOKEN }}
      - name: Upload portrait Home screenshots and measurements
        if: always()
        id: home_portraits
        uses: actions/upload-artifact@v4
        with:
          name: Mylo-Home-portraits
          path: |
            mylo/dist/preview/home-layout/**/*.png
            mylo/dist/preview/home-layout/**/*.json
            mylo/dist/preview/home-layout/matrix.tsv
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Android screenshot and smoke-test evidence
        if: always()
        id: preview
        uses: actions/upload-artifact@v4
        with:
          name: Mylo-Android-preview
          path: mylo/dist/preview/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload search-provider flow screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mylo-search-provider-flow
          path: mylo/dist/preview/provider-flow/
          if-no-files-found: warn
          retention-days: 14
      - name: Print search-provider flow screenshots into the log
        # Compact JPEG copies (base64) so reviewers without artifact access can inspect the real device screens.
        if: always()
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import base64, glob, io, os
          from PIL import Image
          root = "mylo/dist/preview"
          for path in sorted(glob.glob(f"{root}/screens/*/*.png") + glob.glob(f"{root}/provider-flow/*/*.png") + glob.glob(f"{root}/shield/*/*.png") + glob.glob(f"{root}/compat/*/*.png") + glob.glob(f"{root}/private/*/*.png") + glob.glob(f"{root}/voice/*/*.png")):
              name = "/".join(path.split("/")[-2:])
              im = Image.open(path).convert("RGB")
              im = im.resize((540, round(im.height * 540 / im.width)), Image.LANCZOS)
              buf = io.BytesIO(); im.save(buf, "JPEG", quality=70, optimize=True)
              data = base64.b64encode(buf.getvalue()).decode()
              print(f"-----BEGIN MYLO-IMAGE {name}-----")
              for i in range(0, len(data), 4000): print(data[i:i + 4000])
              print(f"-----END MYLO-IMAGE {name}-----")
          for path in sorted(glob.glob(f"{root}/screens/*/*.json") + glob.glob(f"{root}/provider-flow/*/*.json") + glob.glob(f"{root}/shield/*/*.json") + glob.glob(f"{root}/compat/*/*.json")):
              name = "/".join(path.split("/")[-2:])
              print(f"-----BEGIN MYLO-JSON {name}-----"); print(open(path).read()); print(f"-----END MYLO-JSON {name}-----")
          for summary in (f"{root}/screens-test.txt", f"{root}/provider-flow-test.txt", f"{root}/shield-test.txt", f"{root}/compat-test.txt", f"{root}/private-test.txt", f"{root}/voice-test.txt"):
              if os.path.exists(summary):
                  print("-----BEGIN MYLO-SUMMARY-----"); print(open(summary).read()); print("-----END MYLO-SUMMARY-----")
          PY
      - name: Print compatibility screen recordings into the log
        # Small re-encoded copies of the emulator recordings, for reviewers without artifact access.
        if: always() && inputs.scope == 'compat'
        run: |
          command -v ffmpeg > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null; }
          mkdir -p /tmp/small
          for video in mylo/dist/preview/compat/recordings/*.mp4; do
            [[ -s "$video" ]] || continue
            name="$(basename "$video")"
            ffmpeg -loglevel error -y -i "$video" -vf "scale=360:-2,fps=12" -c:v libx264 -crf 32 -preset veryfast -an "/tmp/small/$name" || continue
            echo "-----BEGIN MYLO-VIDEO recordings/$name-----"
            base64 -w 4000 "/tmp/small/$name"
            echo "-----END MYLO-VIDEO recordings/$name-----"
          done
      - name: Link Android evidence
        if: always() && steps.preview.outputs.artifact-url != ''
        env:
          PREVIEW_ARTIFACT_URL: ${{ steps.preview.outputs.artifact-url }}
          HOME_ARTIFACT_URL: ${{ steps.home_portraits.outputs.artifact-url }}
        run: |
          echo "[Download real emulator recording, screenshots, and test evidence]($PREVIEW_ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$HOME_ARTIFACT_URL" ]]; then
            echo "[Download portrait Home screenshots and measurements]($HOME_ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          fi

  evidence:
    # Screenshots, renders and reports in a git branch, for reviewers (and tools) that can fetch git but
    # cannot download Actions artifacts. One commit per run; each run replaces the last.
    name: Publish screenshots to the mylo-ci-evidence branch
    needs: [build, android-preview]
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Layoutlib renders
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: Mylo-Home-reference-renders
          path: evidence/renders
      - name: Download emulator evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: Mylo-Android-preview
          path: evidence/device
      - name: Keep images and reports; turn recordings into frames
        run: |
          command -v ffmpeg > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null; }
          for video in $(find evidence -name '*.mp4' 2> /dev/null); do
            frames="${video%.mp4}-frames"; mkdir -p "$frames"
            ffmpeg -loglevel error -i "$video" -vf "fps=8,scale=540:-2" -q:v 4 "$frames/frame-%03d.jpg" || true
          done
          find evidence -type f ! \( -name '*.png' -o -name '*.jpg' -o -name '*.json' -o -name '*.txt' -o -name '*.tsv' -o -name '*.xml' \) -delete
          find evidence -type f -name '*logcat*' -delete
          {
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo "Scope: ${{ inputs.scope }}"
            echo "Build: ${{ needs.build.result }} · Emulator: ${{ needs.android-preview.result }}"
          } > evidence/RUN.txt
          du -sh evidence; cat evidence/RUN.txt
      - name: Push to mylo-ci-evidence
        working-directory: evidence
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b mylo-ci-evidence
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Evidence for $GITHUB_REF_NAME @ ${GITHUB_SHA::7} (${{ inputs.scope }})"
          # The latest run of any scope, plus one branch per scope so parallel runs keep their own evidence.
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/mylo-ci-evidence HEAD:refs/heads/mylo-ci-evidence-${{ inputs.scope || 'full' }}

  apk:
    # The exact APK the emulator just verified, in a git branch (mylo-apk-<branch>) with its full commit SHA, for
    # phones and reviewers that cannot download Actions artifacts. Only after the approved-screen checks passed.
    name: Publish the verified APK to mylo-apk-<branch>
    needs: [build, android-preview]
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'screens' && needs.android-preview.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the verified APK
        uses: actions/download-artifact@v4
        with:
          name: Mylo-debug
          path: handoff
      - name: Download the device-check summary
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: Mylo-Android-preview
          path: preview
      - name: Push to mylo-apk-${{ github.ref_name }}
        working-directory: handoff
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Branch: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Built at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "APK SHA-256: $(cut -d' ' -f1 Mylo-debug.apk.sha256)"
            echo
            echo "Device checks on the Android 35 emulator (this exact APK):"
            cat ../preview/screens-test.txt 2> /dev/null || echo "  (summary missing)"
          } > BUILD_INFO.txt
          cat BUILD_INFO.txt
          git init -q -b handoff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Mylo-debug.apk Mylo-debug.apk.sha256 BUILD_INFO.txt
          git commit -q -m "Mylo-debug.apk built and device-checked from $GITHUB_REF_NAME @ $GITHUB_SHA"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/mylo-apk-${GITHUB_REF_NAME}
