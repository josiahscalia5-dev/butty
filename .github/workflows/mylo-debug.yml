name: Mylo debug APK

# This workflow belongs at the repository root. The Android project is in mylo/.
on:
  workflow_dispatch:
    inputs:
      full_home_matrix:
        description: Run the optional full Home screenshot matrix
        type: boolean
        default: false
  push:
    branches: ["codex-development"]
    paths:
      - "mylo/**"
      - ".github/workflows/mylo-debug.yml"
  pull_request:
    paths:
      - "mylo/**"
      - ".github/workflows/mylo-debug.yml"

permissions:
  contents: read

concurrency:
  group: mylo-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable APK and run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mylo
    outputs:
      apk-url: ${{ steps.apk.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false
      - name: Ensure Android 35 build tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK and run URL resolver tests
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest --tests com.mylo.browser.BrowserStateTest
      - name: Verify and package debug APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Mylo-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/Mylo-debug.apk
          cd dist
          sha256sum Mylo-debug.apk > Mylo-debug.apk.sha256
      - name: Upload installable Mylo APK
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: Mylo-debug
          path: |
            mylo/dist/Mylo-debug.apk
            mylo/dist/Mylo-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK download link
        env:
          APK_ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          {
            echo '## Install Mylo on Android'
            echo
            echo "[Download Mylo-debug]($APK_ARTIFACT_URL)"
            echo
            echo 'Tap the artifact link, download its ZIP, extract it, then tap Mylo-debug.apk on your Android phone.'
            echo 'The APK is debug signed. Android may ask you to allow installation from the app you use to open it.'
            echo
            echo 'URL resolver tests passed. APK signature verification passed.'
            echo "Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mylo-unit-test-reports
          path: |
            mylo/app/build/reports/tests/testDebugUnitTest/
            mylo/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build live search instrumentation APK
        id: test_apk_build
        run: gradle --no-daemon --stacktrace :app:assembleDebugAndroidTest
      - name: Render the production Home against the approved reference
        if: github.event_name == 'workflow_dispatch' && inputs.full_home_matrix
        id: home_layoutlib
        continue-on-error: true
        run: gradle --no-daemon --stacktrace :app:recordPaparazziDebug --tests com.mylo.browser.HomePreviewTest
      - name: Upload Android Home reference renders
        if: always() && github.event_name == 'workflow_dispatch' && inputs.full_home_matrix
        uses: actions/upload-artifact@v4
        with:
          name: Mylo-Home-reference-renders
          path: |
            mylo/app/src/test/snapshots/images/
            mylo/app/src/main/res/drawable-nodpi/approved_home.jpg
            mylo/app/build/reports/paparazzi/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload instrumentation APK
        if: steps.test_apk_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Mylo-debug-tests
          path: mylo/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7


  android-home:
    if: github.event_name == 'workflow_dispatch' && inputs.full_home_matrix
    name: Verify portrait Home on a Pixel 5
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Download the exact APK published above
        uses: actions/download-artifact@v4
        with:
          name: Mylo-debug
          path: mylo/dist
      - name: Download Home test APK
        uses: actions/download-artifact@v4
        with:
          name: Mylo-debug-tests
          path: mylo/dist/tests
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Home portrait sizes, navigation modes, and keyboard
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash mylo/scripts/verify-home-layout.sh mylo/dist/Mylo-debug.apk mylo/dist/home-layout mylo/dist/tests/app-debug-androidTest.apk
      - name: Upload portrait Home screenshots, measurements, and logs
        if: always()
        id: home_portraits
        uses: actions/upload-artifact@v4
        with:
          name: Mylo-Home-portraits
          path: mylo/dist/home-layout/
          if-no-files-found: warn
          retention-days: 14
      - name: Link Home evidence
        if: always() && steps.home_portraits.outputs.artifact-url != ''
        env:
          HOME_ARTIFACT_URL: ${{ steps.home_portraits.outputs.artifact-url }}
        run: echo "[Download real Home screenshots, measurements, and logs]($HOME_ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"

  android-preview:
    name: Verify browser polish and Yahoo compatibility
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # APK download remains available in the build job even if live verification fails.
    # A provider denial must remain a visible failure, never a claimed verification.
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Download the exact APK published above
        uses: actions/download-artifact@v4
        with:
          name: Mylo-debug
          path: mylo/dist
      - name: Download live search test APK
        uses: actions/download-artifact@v4
        with:
          name: Mylo-debug-tests
          path: mylo/dist/tests
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up network diagnostics runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Yahoo, Google, toolbar navigation and Shield
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          emulator-options: -no-window -memory 4096 -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: timeout -k 10s 360s bash mylo/scripts/verify-browser-polish.sh mylo/dist/Mylo-debug.apk mylo/dist/preview mylo/dist/tests/app-debug-androidTest.apk
      - name: Upload Android screenshot and smoke-test evidence
        if: always()
        id: preview
        uses: actions/upload-artifact@v4
        with:
          name: Mylo-Android-preview
          path: mylo/dist/preview/
          if-no-files-found: warn
          retention-days: 14
      - name: Link Android evidence
        if: always() && steps.preview.outputs.artifact-url != ''
        env:
          PREVIEW_ARTIFACT_URL: ${{ steps.preview.outputs.artifact-url }}
        run: |
          echo "[Download real emulator recording, screenshots, and test evidence]($PREVIEW_ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
