<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mylo app links</title><link rel="icon" href="/favicon.png"><link rel="stylesheet" href="/mylo.css"><script src="/mylo.js"></script></head>
<body>
<h1>App links</h1>
<p>Links meant for other apps, and unsafe links that must never run.</p>
<a id="tel" class="button" href="tel:+15550100">Call +1 555 0100</a>
<a id="mailto" class="button" href="mailto:hello@example.com?subject=Mylo">Email hello@example.com</a>
<a id="intent-fallback" class="button" href="intent://example.invalid/item#Intent;scheme=myloexample;package=com.example.notinstalled;S.browser_fallback_url=http%3A%2F%2Flocalhost%3A8080%2Ffallback.html;end">Open in an app (with web fallback)</a>
<a id="custom" class="button" href="myloexample://open?item=1">Open myloexample:// link</a>
<a id="file" class="button secondary" href="file:///sdcard/">file: link</a>
<div id="status" class="result">ready</div>
<script>
// Without a tap, a page may not send you to another app.
if (param('auto') === '1') setTimeout(() => { location.href = 'myloexample://auto'; show('status', 'tried to open an app automatically'); }, 600);
</script>
</body></html>
